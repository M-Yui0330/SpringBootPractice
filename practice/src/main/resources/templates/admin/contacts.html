<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせ一覧</title>
</head>
<body>
    <h1>お問い合わせ一覧</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>姓</th>
                <th>名</th>
                <th>お問い合わせ種別</th>
                <th>作成日時</th>
                <th>更新日時</th>
				<th>編集</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contact : ${contactList}">
                <td >
					<a th:href="@{'/admin/contacts/' + ${contact.id}}" th:text="${contact.id}"></a>
				</td>
                <td th:text="${contact.lastName}"></td>
                <td th:text="${contact.firstName}"></td>
                <td th:text="${contact.contactType}"></td>
                <td th:text="${contact.createdAt}"></td>
                <td th:text="${contact.updatedAt}"></td>
				<td>
					<a th:href="@{'/admin/contacts/' + ${contact.id} + '/edit'}">編集</a>
				</td>
            </tr>
        </tbody>
    </table>

    <form th:action="@{/admin/signout}" method="post">
        <button type="submit">ログアウト</button>
    </form>
</body>
</html>
