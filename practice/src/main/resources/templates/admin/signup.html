<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>管理者新規登録</title>
</head>
<body>
  <h1>管理者新規登録</h1>

  <form th:action="@{/admin/signup}" th:object="${adminForm}" method="post">
    <table>
      <tr>
        <th>姓：</th>
        <td><input type="text" th:field="*{lastName}" required></td>
      </tr>
      <tr>
        <th>名：</th>
        <td><input type="text" th:field="*{firstName}" required></td>
      </tr>
      <tr>
        <th>メールアドレス：</th>
        <td><input type="email" th:field="*{email}" required></td>
      </tr>
      <tr>
        <th>パスワード：</th>
        <td><input type="password" th:field="*{password}" required></td>
      </tr>
    </table>
    <br>
    <button type="submit">登録</button>
  </form>
</body>
</html>
